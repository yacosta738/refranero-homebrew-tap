name: Update refranero formula

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check release assets and generate formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(gh release view --repo yacosta738/refranero --json tagName,assets)
          tag=$(jq -r '.tagName' <<< "$release")
          version=${tag#v}
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          assets=$(jq -r '.assets[].name' <<< "$release")
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            asset="refranero-${version}-${target}.tar.gz"
            if ! grep -Fxq "$asset" <<< "$assets" || ! grep -Fxq "${asset}.sha256" <<< "$assets"; then
              echo "Latest release $tag does not have the complete package-manager asset set yet; leaving the tap unchanged."
              exit 0
            fi
          done
          assets_dir="$RUNNER_TEMP/refranero-assets"
          mkdir -p "$assets_dir"
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            asset="refranero-${version}-${target}.tar.gz"
            gh release download "$tag" --repo yacosta738/refranero \
              --pattern "$asset" --pattern "${asset}.sha256" --dir "$assets_dir"
            (cd "$assets_dir" && sha256sum -c "${asset}.sha256")
          done
          arm_sha=$(awk '{print $1}' "$assets_dir/refranero-${version}-aarch64-apple-darwin.tar.gz.sha256")
          intel_sha=$(awk '{print $1}' "$assets_dir/refranero-${version}-x86_64-apple-darwin.tar.gz.sha256")
          [[ "$arm_sha" =~ ^[a-f0-9]{64}$ ]]
          [[ "$intel_sha" =~ ^[a-f0-9]{64}$ ]]
          cat > Formula/refranero.rb <<FORMULA
          class Refranero < Formula
            desc "Offline-first command-line proverbs with optional Cervantes and Wayback imports"
            homepage "https://github.com/yacosta738/refranero"
            version "${version}"
            license "MIT"

            on_macos do
              url "https://github.com/yacosta738/refranero/releases/download/v${version}/refranero-${version}-aarch64-apple-darwin.tar.gz"
              sha256 "${arm_sha}"

              if Hardware::CPU.intel?
                url "https://github.com/yacosta738/refranero/releases/download/v${version}/refranero-${version}-x86_64-apple-darwin.tar.gz"
                sha256 "${intel_sha}"
              end
            end

            def install
              bin.install "refranero"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/refranero --version")
            end
          end
          FORMULA
      - name: Commit formula update
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/refranero.rb; then
            echo "Formula is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/refranero.rb
          git commit -m "chore: update refranero formula"
          git push
